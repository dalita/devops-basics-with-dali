apiVersion: apps/v1
kind: Deployment

metadata:
  name: hogwarts-portal

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
      - name: frontend

        image: nginx:latest

        ports:
        - containerPort: 80