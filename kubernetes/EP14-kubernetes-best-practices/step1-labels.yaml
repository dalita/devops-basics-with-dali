apiVersion: apps/v1
kind: Deployment

metadata:
  name: best-practices-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: demo

  template:
    metadata:
      labels:
        app: demo
        enviroment: training
        tier: frontend

    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80